       inkscape:label="q"><tspan
         sodipodi:role="line"
         id="tspan1"
         x="-506.19278"
         y="-88.232521">Marie Kondo</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:64.6568px;line-height:1;font-family:Dubai;-inkscape-font-specification:'Dubai, Bold';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;display:inline;fill:#000000;fill-opacity:1;stroke-width:0.215524;stroke-opacity:0.768627;image-rendering:auto"
       x="-506.64456"
       y="41.462669"
       id="text10-6"
       inkscape:label="q"><tspan
         sodipodi:role="line"
         id="tspan15"
         x="-506.64456"
         y="41.462669"
         style="stroke-width:0.215524">is a japanese organizing consultant</tspan><tspan
         sodipodi:role="line"
         id="tspan16"
         x="-506.64456"
         y="106.1195"
         style="stroke-width:0.215524">who published four books and a</tspan><tspan
         sodipodi:role="line"
         id="tspan17"
         x="-506.64456"
         y="170.77634"
         style="stroke-width:0.215524">successful show about tidying up.</tspan><tspan
         sodipodi:role="line"
         id="tspan18"
         x="-506.64456"
         y="235.43317"
         style="stroke-width:0.215524">Her works inspire millions of people</tspan><tspan
         sodipodi:role="line"
         id="tspan19"
         x="-506.64456"
         y="300.09"
         style="stroke-width:0.215524">to clean their homes and get rid of</tspan><tspan
         sodipodi:role="line"
         id="tspan20"
         x="-506.64456"
         y="364.74683"
         style="stroke-width:0.215524">everything that doesn't spark joy.</tspan></text><rect
